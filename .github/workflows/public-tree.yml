name: public-tree

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public tree
        shell: pwsh
        run: ./tools/validate-public-tree.ps1
      - name: Verify kernel module loader
        shell: pwsh
        run: ./tools/verify-module-loader.ps1
